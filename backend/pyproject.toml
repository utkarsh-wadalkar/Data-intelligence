[project]
name = "data-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "alembic>=1.13,<2",
  "pymysql>=1.1,<2",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "modal>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.13,<1"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
