services:
  - type: web
    name: data-intelligence-web
    runtime: static
    buildCommand: cd frontend && corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
